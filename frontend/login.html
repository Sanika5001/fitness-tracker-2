<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitTrack - Log in</title>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="page-title">FitTrack</h1>
      <p class="label-text">Log in to your account</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="label-text">Username</label>
        <input type="text" id="username" name="username" class="form-input" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password" class="label-text">Password</label>
        <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
      </div>

      <div id="authMsg" class="form-message"></div>

      <button type="submit" class="btn-primary btn-full">Log in</button>
    </form>

    <div class="auth-footer">
      <p class="muted-text">Try the demo: username demo, password demo123</p>
      <p style="margin-top: 8px;">
        <span class="muted-text">Need an account?</span>
        <a href="register.html" class="auth-link">Register</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js?v=1"></script>
</body>
</html>
